# Physical process model for a municipal wastewater treatment PLC (CC-BY-4.0):
# activated-sludge aeration basin with secondary clarifier.
#
# Tables follow the Modbus data model. Register values are engineering values multiplied
# by `scale` and stored as unsigned 16-bit integers.
# `normal` is the operating band an operator would consider routine; values written
# outside it are what an analyst should notice.
#
# Models:
#   const   — nominal value plus optional noise
#   follow  — first-order lag towards `source` * gain + offset (+ each `inputs` source * its
#             gain), clamped to `limits`, time constant tau [s]
#   daily   — nominal + amplitude * sin(2*pi*(hour - phase_h)/24) + noise
#   walk    — bounded random walk inside `normal`, `step` per sqrt(second)
#   counter — monotonically increasing by `rate` per second (wraps at 65536)
#   above / below — bit set when point `a` is above / below point `b` (or a constant)
#
# Control chain: the DO controller drives blower speed from the DO setpoint and the
# influent load; dissolved oxygen follows blower air supply minus oxygen demand, and
# effluent ammonia rises when DO drops. More return sludge pumping lowers the clarifier
# sludge blanket.

id: wastewater_treatment
title: Wastewater treatment — aeration basin and secondary clarifier
unit_id: 1

holding:
  - {address: 0, name: do_sp, unit: mg/L, scale: 100, nominal: 2.0, normal: [1.5, 2.5], writable: true}
  - {address: 1, name: ras_flow_sp, unit: m3/h, scale: 10, nominal: 180, normal: [140, 220], writable: true}
  - {address: 2, name: was_flow_sp, unit: m3/h, scale: 10, nominal: 12, normal: [8, 16], writable: true}
  - {address: 3, name: do_low_alarm, unit: mg/L, scale: 100, nominal: 0.8, normal: [0.5, 1.0], writable: true}
  - {address: 4, name: blanket_high_alarm, unit: m, scale: 100, nominal: 2.5, normal: [2.3, 2.8], writable: true}
  - {address: 5, name: ph_low_alarm, unit: pH, scale: 100, nominal: 6.5, normal: [6.3, 6.7], writable: true}
  - {address: 6, name: ph_high_alarm, unit: pH, scale: 100, nominal: 8.5, normal: [8.3, 8.7], writable: true}
  - {address: 7, name: ammonia_high_alarm, unit: mg/L, scale: 100, nominal: 5.0, normal: [4.0, 6.0], writable: true}
  - {address: 8, name: mode, unit: "", scale: 1, nominal: 2, normal: [1, 2], writable: true}

input:
  - {address: 0, name: influent_flow, unit: m3/h, scale: 10, nominal: 850, normal: [550, 1150], model: {type: daily, amplitude: 220, phase_h: 7, noise: 12}}
  - {address: 1, name: blower_speed, unit: "%", scale: 10, nominal: 70, normal: [45, 95], model: {type: follow, source: do_sp, gain: 25, offset: -14, inputs: [{source: influent_flow, gain: 0.04}], limits: [20, 100], tau: 120, noise: 0.4}}
  - {address: 2, name: dissolved_oxygen, unit: mg/L, scale: 100, nominal: 2.0, normal: [1.2, 2.8], model: {type: follow, source: blower_speed, gain: 0.04, offset: 0.56, inputs: [{source: influent_flow, gain: -0.0016}], limits: [0.05, 8.5], tau: 300, noise: 0.03}}
  - {address: 3, name: ammonia, unit: mg/L, scale: 100, nominal: 1.0, normal: [0.2, 2.5], model: {type: follow, source: dissolved_oxygen, gain: -0.8, offset: 0.9, inputs: [{source: influent_flow, gain: 0.002}], limits: [0.05, 25], tau: 2400, noise: 0.03}}
  - {address: 4, name: ras_flow, unit: m3/h, scale: 10, nominal: 180, normal: [130, 230], model: {type: follow, source: ras_flow_sp, tau: 30, noise: 1.0}}
  - {address: 5, name: sludge_blanket_level, unit: m, scale: 100, nominal: 1.6, normal: [1.0, 2.2], model: {type: follow, source: ras_flow, gain: -0.01, offset: 3.4, limits: [0.2, 4.5], tau: 1800, noise: 0.02}}
  - {address: 6, name: was_flow, unit: m3/h, scale: 10, nominal: 12, normal: [7, 17], model: {type: follow, source: was_flow_sp, tau: 30, noise: 0.2}}
  - {address: 7, name: ph, unit: pH, scale: 100, nominal: 7.2, normal: [6.9, 7.6], model: {type: walk, step: 0.0008}}
  - {address: 8, name: mlss, unit: mg/L, scale: 1, nominal: 3200, normal: [2800, 3600], model: {type: walk, step: 0.8}}
  - {address: 9, name: basin_temp, unit: degC, scale: 10, nominal: 16.5, normal: [15.5, 17.5], model: {type: walk, step: 0.003}}
  - {address: 10, name: blower1_runtime_h, unit: h, scale: 1, nominal: 26118, model: {type: counter, rate: 0.000277778}}
  - {address: 11, name: influent_total_m3, unit: m3, scale: 1, nominal: 31457, model: {type: counter, rate: 0.236}}

coils:
  - {address: 0, name: blower1_run, nominal: 1, writable: true}
  - {address: 1, name: blower2_run, nominal: 0, writable: true}
  - {address: 2, name: ras_pump_run, nominal: 1, writable: true}
  - {address: 3, name: was_pump_run, nominal: 1, writable: true}
  - {address: 4, name: mixer_run, nominal: 1, writable: true}
  - {address: 5, name: alarm_ack, nominal: 0, writable: true}
  - {address: 6, name: remote_mode, nominal: 1, writable: true}
  - {address: 7, name: spare, nominal: 0, writable: true}

discrete:
  - {address: 0, name: do_low, nominal: 0, model: {type: below, a: dissolved_oxygen, b: do_low_alarm}}
  - {address: 1, name: blanket_high, nominal: 0, model: {type: above, a: sludge_blanket_level, b: blanket_high_alarm}}
  - {address: 2, name: ph_low, nominal: 0, model: {type: below, a: ph, b: ph_low_alarm}}
  - {address: 3, name: ph_high, nominal: 0, model: {type: above, a: ph, b: ph_high_alarm}}
  - {address: 4, name: ammonia_high, nominal: 0, model: {type: above, a: ammonia, b: ammonia_high_alarm}}
  - {address: 5, name: blower1_running, nominal: 1, model: {type: above, a: blower1_run, b: 0.5}}
  - {address: 6, name: blower1_fault, nominal: 0}
  - {address: 7, name: power_ok, nominal: 1}

# What a SCADA/HMI reads every cycle (function code, table, start, count).
poll_groups:
  - {function: 4, start: 0, count: 12}
  - {function: 3, start: 0, count: 9}
  - {function: 1, start: 0, count: 8}
  - {function: 2, start: 0, count: 8}

# Setpoints a legitimate operator adjusts during a shift, and by how much.
operator_adjustable:
  - {name: do_sp, step: [0.1, 0.3]}
  - {name: ras_flow_sp, step: [5, 15]}
  - {name: was_flow_sp, step: [0.5, 2]}

translations:
  pl: {title: "Oczyszczalnia ścieków — komora napowietrzania i osadnik wtórny"}
