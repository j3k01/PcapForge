# Physical process model for a building-automation PLC (CC-BY-4.0): one air-handling
# unit, three fan-coil zones and the chilled-water plant of an office building in the
# cooling season.
#
# Tables follow the Modbus data model. Register values are engineering values multiplied
# by `scale` and stored as unsigned 16-bit integers.
# `normal` is the operating band an operator would consider routine; values written
# outside it are what an analyst should notice.
#
# Models:
#   const   — nominal value plus optional noise
#   follow  — first-order lag towards `source` * gain + offset (+ each `inputs` source * its
#             gain), clamped to `limits`, time constant tau [s]
#   daily   — nominal + amplitude * sin(2*pi*(hour - phase_h)/24) + noise
#   walk    — bounded random walk inside `normal`, `step` per sqrt(second)
#   counter — monotonically increasing by `rate` per second (wraps at 65536)
#   above / below — bit set when point `a` is above / below point `b` (or a constant)
#
# Control chain: occupancy (peaking early afternoon) and outdoor temperature are the
# heat load. Zone temperatures track their setpoints with a small load offset while the
# fan-coil cooling valves absorb the load (a lower setpoint opens them further). CO2
# follows occupancy and opens the outdoor-air damper above its minimum; chilled-water
# return temperature and chiller load rise with the building load.

id: hvac_building
title: Building HVAC — air-handling unit, fan-coil zones and chiller
unit_id: 1

holding:
  - {address: 0, name: zone1_temp_sp, unit: degC, scale: 10, nominal: 22.0, normal: [20.0, 24.0], writable: true}
  - {address: 1, name: zone2_temp_sp, unit: degC, scale: 10, nominal: 22.5, normal: [20.0, 24.0], writable: true}
  - {address: 2, name: zone3_temp_sp, unit: degC, scale: 10, nominal: 21.5, normal: [20.0, 24.0], writable: true}
  - {address: 3, name: supply_air_temp_sp, unit: degC, scale: 10, nominal: 14.0, normal: [12.0, 16.0], writable: true}
  - {address: 4, name: chw_supply_temp_sp, unit: degC, scale: 10, nominal: 7.0, normal: [6.0, 9.0], writable: true}
  - {address: 5, name: min_oa_damper_sp, unit: "%", scale: 10, nominal: 20, normal: [15, 30], writable: true}
  - {address: 6, name: duct_static_pressure_sp, unit: Pa, scale: 1, nominal: 250, normal: [200, 320], writable: true}
  - {address: 7, name: zone_high_temp_alarm, unit: degC, scale: 10, nominal: 27.0, normal: [26.0, 28.0], writable: true}
  - {address: 8, name: mode, unit: "", scale: 1, nominal: 2, normal: [1, 2], writable: true}

input:
  - {address: 0, name: outdoor_air_temp, unit: degC, scale: 10, nominal: 22, normal: [14, 30], model: {type: daily, amplitude: 6, phase_h: 9, noise: 0.1}}
  - {address: 1, name: occupancy, unit: "%", scale: 10, nominal: 50, normal: [0, 100], model: {type: daily, amplitude: 42, phase_h: 7, noise: 1.0}}
  - {address: 2, name: zone_co2, unit: ppm, scale: 1, nominal: 820, normal: [400, 1300], model: {type: follow, source: occupancy, gain: 8, offset: 420, tau: 900, noise: 8}}
  - {address: 3, name: zone1_temp, unit: degC, scale: 10, nominal: 22.0, normal: [19.0, 25.5], model: {type: follow, source: zone1_temp_sp, offset: -1.16, inputs: [{source: occupancy, gain: 0.01}, {source: outdoor_air_temp, gain: 0.03}], limits: [10, 35], tau: 900, noise: 0.05}}
  - {address: 4, name: zone2_temp, unit: degC, scale: 10, nominal: 22.5, normal: [19.0, 25.5], model: {type: follow, source: zone2_temp_sp, offset: -1.6, inputs: [{source: occupancy, gain: 0.01}, {source: outdoor_air_temp, gain: 0.05}], limits: [10, 35], tau: 900, noise: 0.05}}
  - {address: 5, name: zone3_temp, unit: degC, scale: 10, nominal: 21.5, normal: [19.0, 25.5], model: {type: follow, source: zone3_temp_sp, offset: -0.72, inputs: [{source: occupancy, gain: 0.01}, {source: outdoor_air_temp, gain: 0.01}], limits: [10, 35], tau: 900, noise: 0.05}}
  - {address: 6, name: zone1_fcu_valve, unit: "%", scale: 10, nominal: 45, normal: [0, 100], model: {type: follow, source: zone1_temp_sp, gain: -15, offset: 306, inputs: [{source: occupancy, gain: 0.5}, {source: outdoor_air_temp, gain: 2.0}], limits: [0, 100], tau: 180, noise: 0.5}}
  - {address: 7, name: zone2_fcu_valve, unit: "%", scale: 10, nominal: 50, normal: [0, 100], model: {type: follow, source: zone2_temp_sp, gain: -15, offset: 318.5, inputs: [{source: occupancy, gain: 0.5}, {source: outdoor_air_temp, gain: 2.0}], limits: [0, 100], tau: 180, noise: 0.5}}
  - {address: 8, name: zone3_fcu_valve, unit: "%", scale: 10, nominal: 40, normal: [0, 100], model: {type: follow, source: zone3_temp_sp, gain: -15, offset: 293.5, inputs: [{source: occupancy, gain: 0.5}, {source: outdoor_air_temp, gain: 2.0}], limits: [0, 100], tau: 180, noise: 0.5}}
  - {address: 9, name: supply_air_temp, unit: degC, scale: 10, nominal: 14.0, normal: [11.0, 17.0], model: {type: follow, source: supply_air_temp_sp, offset: -1.1, inputs: [{source: outdoor_air_temp, gain: 0.05}], tau: 300, noise: 0.1}}
  - {address: 10, name: duct_static_pressure, unit: Pa, scale: 1, nominal: 250, normal: [180, 340], model: {type: follow, source: duct_static_pressure_sp, tau: 30, noise: 3}}
  - {address: 11, name: supply_fan_speed, unit: "%", scale: 10, nominal: 70, normal: [40, 95], model: {type: follow, source: duct_static_pressure_sp, gain: 0.2, offset: 5, inputs: [{source: occupancy, gain: 0.3}], limits: [0, 100], tau: 60, noise: 0.3}}
  - {address: 12, name: outdoor_air_damper, unit: "%", scale: 10, nominal: 36, normal: [10, 70], model: {type: follow, source: min_oa_damper_sp, offset: -16.8, inputs: [{source: zone_co2, gain: 0.04}], limits: [0, 100], tau: 120, noise: 0.3}}
  - {address: 13, name: chw_supply_temp, unit: degC, scale: 10, nominal: 7.0, normal: [5.5, 9.5], model: {type: follow, source: chw_supply_temp_sp, tau: 600, noise: 0.05}}
  - {address: 14, name: chw_return_temp, unit: degC, scale: 10, nominal: 12.0, normal: [9.0, 16.0], model: {type: follow, source: chw_supply_temp, offset: 0.8, inputs: [{source: occupancy, gain: 0.04}, {source: outdoor_air_temp, gain: 0.1}], tau: 600, noise: 0.05}}
  - {address: 15, name: chiller_load, unit: "%", scale: 10, nominal: 55, normal: [5, 100], model: {type: follow, source: chw_supply_temp_sp, gain: -4, offset: 9, inputs: [{source: occupancy, gain: 0.6}, {source: outdoor_air_temp, gain: 2.0}], limits: [0, 100], tau: 600, noise: 0.5}}
  - {address: 16, name: supply_fan_runtime_h, unit: h, scale: 1, nominal: 41377, model: {type: counter, rate: 0.000277778}}

coils:
  - {address: 0, name: supply_fan_run, nominal: 1, writable: true}
  - {address: 1, name: chiller_enable, nominal: 1, writable: true}
  - {address: 2, name: chw_pump_run, nominal: 1, writable: true}
  - {address: 3, name: zone1_fcu_enable, nominal: 1, writable: true}
  - {address: 4, name: zone2_fcu_enable, nominal: 1, writable: true}
  - {address: 5, name: zone3_fcu_enable, nominal: 1, writable: true}
  - {address: 6, name: alarm_ack, nominal: 0, writable: true}
  - {address: 7, name: remote_mode, nominal: 1, writable: true}

discrete:
  - {address: 0, name: zone1_high_temp, nominal: 0, model: {type: above, a: zone1_temp, b: zone_high_temp_alarm}}
  - {address: 1, name: zone2_high_temp, nominal: 0, model: {type: above, a: zone2_temp, b: zone_high_temp_alarm}}
  - {address: 2, name: zone3_high_temp, nominal: 0, model: {type: above, a: zone3_temp, b: zone_high_temp_alarm}}
  - {address: 3, name: supply_fan_running, nominal: 1, model: {type: above, a: supply_fan_run, b: 0.5}}
  - {address: 4, name: chiller_running, nominal: 1, model: {type: above, a: chiller_enable, b: 0.5}}
  - {address: 5, name: chiller_fault, nominal: 0}
  - {address: 6, name: filter_dirty, nominal: 0}
  - {address: 7, name: fire_alarm, nominal: 0}

# What a SCADA/HMI reads every cycle (function code, table, start, count).
poll_groups:
  - {function: 4, start: 0, count: 17}
  - {function: 3, start: 0, count: 9}
  - {function: 1, start: 0, count: 8}
  - {function: 2, start: 0, count: 8}

# Setpoints a legitimate operator adjusts during a shift, and by how much.
operator_adjustable:
  - {name: zone1_temp_sp, step: [0.5, 1.0]}
  - {name: zone2_temp_sp, step: [0.5, 1.0]}
  - {name: zone3_temp_sp, step: [0.5, 1.0]}
  - {name: supply_air_temp_sp, step: [0.5, 1.0]}
  - {name: duct_static_pressure_sp, step: [10, 30]}

translations:
  pl: {title: "HVAC budynku — centrala wentylacyjna, strefy klimakonwektorów i agregat wody lodowej"}
