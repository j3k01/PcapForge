# Physical process model for a distribution-substation bay controller (CC-BY-4.0):
# one 33/11 kV transformer with on-load tap changer feeding four 11 kV feeders.
#
# Tables follow the Modbus data model. Like most protection relays and power meters, the bay
# controller keeps analog values as IEEE 754 FLOAT32 in two registers, high word first
# (`word_order: big`, ABCD); tap positions, the control mode and the totaliser are UINT16
# (engineering value multiplied by `scale`).
# `normal` is the operating band an operator would consider routine; values written
# outside it are what an analyst should notice.
#
# Models:
#   const   — nominal value plus optional noise
#   follow  — first-order lag towards `source` * gain + offset (+ each `inputs` source * its
#             gain), clamped to `limits`, time constant tau [s]
#   daily   — nominal + amplitude * sin(2*pi*(hour - phase_h)/24) + noise
#   walk    — bounded random walk inside `normal`, `step` per sqrt(second)
#   counter — monotonically increasing by `rate` per second (wraps at 65536)
#   above / below — bit set when point `a` is above / below point `b` (or a constant)
#
# Control chain: the load curve (evening peak) sets feeder currents, reactive power and
# power factor; transformer top-oil temperature follows load with a thermal lag of hours
# and the winding hot spot sits above it. Each tap step moves the 11 kV busbar voltage
# by 1.25 % (0.1375 kV), less the load-dependent voltage drop. Breaker status bits
# mirror the breaker command coils.

id: power_substation
title: Distribution substation — 33/11 kV transformer and feeder bays
unit_id: 1
register_style: {coils: 1, discrete: 10001, input: 30001, holding: 40001}
word_order: big

holding:
  - {address: 0, name: tap_position_sp, unit: "", scale: 1, nominal: 9, normal: [5, 13], writable: true, desc: OLTC tap-position setpoint}
  - {address: 1, name: mode, unit: "", scale: 1, nominal: 2, normal: [1, 2], writable: true, desc: Control mode (1 manual, 2 auto)}
  - {address: 2, name: voltage_high_alarm, type: float32, unit: kV, nominal: 11.6, normal: [11.4, 11.8], writable: true, desc: Busbar overvoltage alarm threshold}
  - {address: 4, name: voltage_low_alarm, type: float32, unit: kV, nominal: 10.4, normal: [10.2, 10.6], writable: true, desc: Busbar undervoltage alarm threshold}
  - {address: 6, name: oil_temp_alarm, type: float32, unit: degC, nominal: 90, normal: [85, 95], writable: true, desc: Transformer oil high-temperature alarm threshold}
  - {address: 8, name: overcurrent_pickup, type: float32, unit: A, nominal: 600, normal: [500, 700], writable: true, desc: Feeder overcurrent pickup}
  - {address: 10, name: frequency_low_alarm, type: float32, unit: Hz, nominal: 49.8, normal: [49.7, 49.9], writable: true, desc: Underfrequency alarm threshold}

input:
  - {address: 0, name: tap_position, unit: "", scale: 1, nominal: 9, normal: [1, 17], model: {type: follow, source: tap_position_sp, limits: [1, 17], tau: 20}, desc: OLTC tap position feedback}
  - {address: 1, name: energy_import_mwh, unit: MWh, scale: 1, nominal: 21873, model: {type: counter, rate: 0.00389}, desc: Imported-energy totaliser}
  - {address: 2, name: load_mw, type: float32, unit: MW, nominal: 14, normal: [8, 20], model: {type: daily, amplitude: 4, phase_h: 12.5, noise: 0.1}, desc: Transformer load}
  - {address: 4, name: bus_voltage, type: float32, unit: kV, nominal: 11.0, normal: [10.7, 11.3], model: {type: follow, source: tap_position, gain: 0.1375, offset: 9.9725, inputs: [{source: load_mw, gain: -0.015}], tau: 30, noise: 0.01}, desc: 11 kV busbar voltage}
  - {address: 6, name: frequency, type: float32, unit: Hz, nominal: 50.0, normal: [49.95, 50.05], model: {type: walk, step: 0.0005}, desc: System frequency}
  - {address: 8, name: power_factor, type: float32, unit: "", nominal: 0.948, normal: [0.92, 0.98], model: {type: follow, source: load_mw, gain: -0.003, offset: 0.99, tau: 60, noise: 0.002}, desc: Power factor}
  - {address: 10, name: reactive_mvar, type: float32, unit: Mvar, nominal: 4.6, normal: [2, 8], model: {type: follow, source: load_mw, gain: 0.33, tau: 60, noise: 0.03}, desc: Reactive power}
  - {address: 12, name: feeder1_current, type: float32, unit: A, nominal: 232, normal: [100, 380], model: {type: follow, source: load_mw, gain: 16.6, tau: 5, noise: 1.5}, desc: Feeder 1 current}
  - {address: 14, name: feeder2_current, type: float32, unit: A, nominal: 193, normal: [80, 320], model: {type: follow, source: load_mw, gain: 13.8, tau: 5, noise: 1.5}, desc: Feeder 2 current}
  - {address: 16, name: feeder3_current, type: float32, unit: A, nominal: 193, normal: [80, 320], model: {type: follow, source: load_mw, gain: 13.8, tau: 5, noise: 1.5}, desc: Feeder 3 current}
  - {address: 18, name: feeder4_current, type: float32, unit: A, nominal: 154, normal: [60, 260], model: {type: follow, source: load_mw, gain: 11.0, tau: 5, noise: 1.5}, desc: Feeder 4 current}
  - {address: 20, name: oil_temp, type: float32, unit: degC, nominal: 50, normal: [35, 75], model: {type: follow, source: load_mw, gain: 2.0, offset: 22, tau: 5400, noise: 0.1}, desc: Transformer oil temperature}
  - {address: 22, name: winding_temp, type: float32, unit: degC, nominal: 66.8, normal: [45, 95], model: {type: follow, source: oil_temp, inputs: [{source: load_mw, gain: 1.2}], tau: 600, noise: 0.1}, desc: Transformer winding temperature}

coils:
  - {address: 0, name: feeder1_cb_close, nominal: 1, writable: true, desc: Feeder 1 breaker close command}
  - {address: 1, name: feeder2_cb_close, nominal: 1, writable: true, desc: Feeder 2 breaker close command}
  - {address: 2, name: feeder3_cb_close, nominal: 1, writable: true, desc: Feeder 3 breaker close command}
  - {address: 3, name: feeder4_cb_close, nominal: 1, writable: true, desc: Feeder 4 breaker close command}
  - {address: 4, name: bus_coupler_close, nominal: 0, writable: true, desc: Bus-coupler breaker close command}
  - {address: 5, name: avr_auto, nominal: 1, writable: true, desc: Automatic voltage regulation enabled}
  - {address: 6, name: alarm_reset, nominal: 0, writable: true, desc: Alarm reset}
  - {address: 7, name: remote_mode, nominal: 1, writable: true, desc: Remote/SCADA control enabled}

discrete:
  - {address: 0, name: feeder1_cb_closed, nominal: 1, model: {type: above, a: feeder1_cb_close, b: 0.5}, desc: Feeder 1 breaker closed}
  - {address: 1, name: feeder2_cb_closed, nominal: 1, model: {type: above, a: feeder2_cb_close, b: 0.5}, desc: Feeder 2 breaker closed}
  - {address: 2, name: feeder3_cb_closed, nominal: 1, model: {type: above, a: feeder3_cb_close, b: 0.5}, desc: Feeder 3 breaker closed}
  - {address: 3, name: feeder4_cb_closed, nominal: 1, model: {type: above, a: feeder4_cb_close, b: 0.5}, desc: Feeder 4 breaker closed}
  - {address: 4, name: feeder1_overcurrent, nominal: 0, model: {type: above, a: feeder1_current, b: overcurrent_pickup}, desc: Feeder 1 overcurrent}
  - {address: 5, name: feeder2_overcurrent, nominal: 0, model: {type: above, a: feeder2_current, b: overcurrent_pickup}, desc: Feeder 2 overcurrent}
  - {address: 6, name: feeder3_overcurrent, nominal: 0, model: {type: above, a: feeder3_current, b: overcurrent_pickup}, desc: Feeder 3 overcurrent}
  - {address: 7, name: feeder4_overcurrent, nominal: 0, model: {type: above, a: feeder4_current, b: overcurrent_pickup}, desc: Feeder 4 overcurrent}
  - {address: 8, name: voltage_high, nominal: 0, model: {type: above, a: bus_voltage, b: voltage_high_alarm}, desc: Busbar overvoltage alarm}
  - {address: 9, name: voltage_low, nominal: 0, model: {type: below, a: bus_voltage, b: voltage_low_alarm}, desc: Busbar undervoltage alarm}
  - {address: 10, name: oil_temp_high, nominal: 0, model: {type: above, a: oil_temp, b: oil_temp_alarm}, desc: Oil high-temperature alarm}
  - {address: 11, name: frequency_low, nominal: 0, model: {type: below, a: frequency, b: frequency_low_alarm}, desc: Underfrequency alarm}
  - {address: 12, name: buchholz_alarm, nominal: 0, desc: Buchholz (gas) alarm}
  - {address: 13, name: dc_supply_ok, nominal: 1, desc: DC supply healthy}

# What a SCADA/RTU master reads every cycle (function code, table, start, count).
poll_groups:
  - {function: 4, start: 0, count: 24}
  - {function: 3, start: 0, count: 12}
  - {function: 1, start: 0, count: 8}
  - {function: 2, start: 0, count: 14}

# Setpoints a legitimate operator adjusts during a shift, and by how much.
operator_adjustable:
  - {name: tap_position_sp, step: [1, 1]}

translations:
  pl: {title: "Stacja elektroenergetyczna SN — transformator 33/11 kV i pola odpływowe"}
