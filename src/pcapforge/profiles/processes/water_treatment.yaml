# Physical process model for a small drinking-water treatment PLC (CC-BY-4.0).
#
# Tables follow the Modbus data model. Register values are engineering values multiplied
# by `scale` and stored as unsigned 16-bit integers.
# `normal` is the operating band an operator would consider routine; values written
# outside it are what an analyst should notice.
#
# Models:
#   const   — nominal value plus optional noise
#   follow  — first-order lag towards `source` (another point) * gain + offset, time constant tau [s]
#   daily   — nominal + amplitude * sin(2*pi*(hour - phase_h)/24) + noise
#   walk    — bounded random walk inside `normal`, `step` per sqrt(second)
#   counter — monotonically increasing by `rate` per second (wraps at 65536)
#   above / below — bit set when point `a` is above / below point `b` (or a constant)

id: water_treatment
title: Drinking-water treatment — clearwell and chlorination
unit_id: 1

holding:
  - {address: 0, name: clearwell_level_sp, unit: cm, scale: 1, nominal: 350, normal: [320, 380], writable: true}
  - {address: 1, name: chlorine_dose_sp, unit: mg/L, scale: 100, nominal: 1.8, normal: [1.2, 2.4], writable: true}
  - {address: 2, name: pump1_speed_sp, unit: "%", scale: 10, nominal: 72, normal: [55, 90], writable: true}
  - {address: 3, name: ph_sp, unit: pH, scale: 100, nominal: 7.2, normal: [6.9, 7.6], writable: true}
  - {address: 4, name: level_high_alarm, unit: cm, scale: 1, nominal: 450, normal: [430, 470], writable: true}
  - {address: 5, name: level_low_alarm, unit: cm, scale: 1, nominal: 120, normal: [100, 150], writable: true}
  - {address: 6, name: chlorine_high_alarm, unit: mg/L, scale: 100, nominal: 4.0, normal: [3.5, 4.5], writable: true}
  - {address: 7, name: pid_level_kp, unit: "", scale: 100, nominal: 1.25, normal: [0.8, 2.0], writable: true}
  - {address: 8, name: pid_level_ti, unit: s, scale: 1, nominal: 240, normal: [120, 400], writable: true}
  - {address: 9, name: mode, unit: "", scale: 1, nominal: 2, normal: [1, 2], writable: true}

input:
  - {address: 0, name: clearwell_level, unit: cm, scale: 1, nominal: 350, model: {type: follow, source: clearwell_level_sp, tau: 900, noise: 1.2}}
  - {address: 1, name: chlorine_residual, unit: mg/L, scale: 100, nominal: 1.1, model: {type: follow, source: chlorine_dose_sp, gain: 0.62, tau: 1200, noise: 0.015}}
  - {address: 2, name: pump1_speed, unit: "%", scale: 10, nominal: 72, model: {type: follow, source: pump1_speed_sp, tau: 25, noise: 0.3}}
  - {address: 3, name: ph, unit: pH, scale: 100, nominal: 7.2, model: {type: follow, source: ph_sp, tau: 1800, noise: 0.01}}
  - {address: 4, name: inlet_flow, unit: m3/h, scale: 10, nominal: 118, model: {type: daily, amplitude: 22, phase_h: 13, noise: 1.5}}
  - {address: 5, name: outlet_flow, unit: m3/h, scale: 10, nominal: 115, model: {type: daily, amplitude: 25, phase_h: 13.5, noise: 1.8}}
  - {address: 6, name: water_temp, unit: degC, scale: 10, nominal: 11.5, normal: [10.5, 12.5], model: {type: walk, step: 0.004}}
  - {address: 7, name: turbidity, unit: NTU, scale: 100, nominal: 0.18, normal: [0.08, 0.35], model: {type: walk, step: 0.002}}
  - {address: 8, name: pump1_runtime_h, unit: h, scale: 1, nominal: 18214, model: {type: counter, rate: 0.000277778}}
  - {address: 9, name: treated_volume_m3, unit: m3, scale: 1, nominal: 40321, model: {type: counter, rate: 0.032}}

coils:
  - {address: 0, name: pump1_run, nominal: 1, writable: true}
  - {address: 1, name: pump2_run, nominal: 0, writable: true}
  - {address: 2, name: dosing_pump_run, nominal: 1, writable: true}
  - {address: 3, name: inlet_valve_open, nominal: 1, writable: true}
  - {address: 4, name: backwash_request, nominal: 0, writable: true}
  - {address: 5, name: alarm_ack, nominal: 0, writable: true}
  - {address: 6, name: remote_mode, nominal: 1, writable: true}
  - {address: 7, name: spare, nominal: 0, writable: true}

discrete:
  - {address: 0, name: level_high, nominal: 0, model: {type: above, a: clearwell_level, b: level_high_alarm}}
  - {address: 1, name: level_low, nominal: 0, model: {type: below, a: clearwell_level, b: level_low_alarm}}
  - {address: 2, name: chlorine_high, nominal: 0, model: {type: above, a: chlorine_residual, b: chlorine_high_alarm}}
  - {address: 3, name: pump1_fault, nominal: 0}
  - {address: 4, name: dosing_pump_fault, nominal: 0}
  - {address: 5, name: door_open, nominal: 0}
  - {address: 6, name: power_ok, nominal: 1}
  - {address: 7, name: spare, nominal: 0}

# What a SCADA/HMI reads every cycle (function code, table, start, count).
poll_groups:
  - {function: 4, start: 0, count: 10}
  - {function: 3, start: 0, count: 10}
  - {function: 1, start: 0, count: 8}
  - {function: 2, start: 0, count: 8}

# Setpoints a legitimate operator adjusts during a shift, and by how much.
operator_adjustable:
  - {name: clearwell_level_sp, step: [5, 15]}
  - {name: chlorine_dose_sp, step: [0.05, 0.2]}
  - {name: pump1_speed_sp, step: [2, 6]}

translations:
  pl: {title: "Uzdatnianie wody pitnej — zbiornik wody czystej i chlorowanie"}
