# Device and network-stack profiles (CC-BY-4.0).
#
# A *stack* describes how an operating system's TCP/IP implementation looks on the wire.
# A *device* binds a vendor (MAC OUIs) to a stack, application processing latency and,
# for field devices, the identity they report over their industrial protocol.
# OUIs are verified against Wireshark's manufacturer database (`tshark -G manuf`).
#
# `link_local` (stacks): IP header of datagrams to link-local multicast groups and the subnet
# broadcast; defaults to the stack's `df` and `ttl`.
# `browser` (devices): Computer Browser host announcements (`windows.chatter`): announced OS
# version and SV_TYPE_* server type bits; devices without it do not announce themselves.
# `link_mbps` (devices): NIC speed; back-to-back TCP segments of a message are spaced by their
# serialisation time (routed senders: the slower of the sender's and the router's link).
# `initial_window` (stacks): congestion window in segments when a message starts after idle.
# `syn_rto_s` (stacks): initial retransmission timeout of an unanswered SYN.
# `drops_unsolicited` (stacks): the host firewall silently drops inbound SYNs to closed ports
# instead of answering with RST (Windows Defender Firewall default). The composer then shows a probe
# of such a host as filtered (no reply, the client retransmits its SYN at `syn_rto_s`) rather than
# closed (RST); see `compose/_apply_host_firewall`.

stacks:
  windows:
    ttl: 128
    df: true
    ip_id: global          # one incrementing counter per host
    mss: 1460
    syn_window: 64240
    window_scale: 8
    window: 1026           # raw window field after the handshake (x 2^scale)
    syn_options: [mss, nop, ws, nop, nop, sack_perm]
    timestamps: false
    ephemeral_ports: [49152, 65535]
    port_allocation: sequential
    delayed_ack: {probability: 0.55, min_ms: 1, max_ms: 200}
    rto: {min_ms: 300, plus_rtt: false}   # retransmission timeout on a LAN
    initial_window: 10     # segments after idle (IW10 since Windows Server 2016 / Windows 10)
    syn_rto_s: 3.0         # TCP InitialRto (netsh int tcp show global: 3000 ms)
    drops_unsolicited: true
    # Checked against a Windows 10 capture: no DF on link-local datagrams; LLMNR (dnscache)
    # TTL 1, SSDP M-SEARCH (SSDPSRV) TTL 4; mDNS uses 255 (RFC 6762 section 11); NBNS and
    # browser broadcasts keep the default 128.
    link_local:
      df: false
      ttl: {224.0.0.252: 1, 239.255.255.250: 4, 224.0.0.251: 255}
    # IPv6 is on by default with a randomized link-local interface identifier. LLMNR and
    # DHCPv6 use hop limit 1, mDNS 255 (RFC 6762); ND (255) and MLD (1) are fixed by their RFCs.
    # Groups: LLMNR, mDNS, SSDP (besides the solicited-node group). RS: RFC 4861 defaults.
    ipv6:
      multicast_hop_limit: {ff02::1:3: 1, ff02::fb: 255, ff02::1:2: 1}
      groups: [ff02::1:3, ff02::fb, ff02::c]
      router_solicitations: 3
      rs_interval_s: 4
  linux:
    ttl: 64
    df: true
    ip_id: per_flow        # random start, increments per socket
    mss: 1460
    syn_window: 64240
    window_scale: 7
    window: 502
    syn_options: [mss, sack_perm, ts, nop, ws]
    timestamps: true
    ephemeral_ports: [32768, 60999]
    port_allocation: random
    delayed_ack: {probability: 0.35, min_ms: 40, max_ms: 45}
    rto: {min_ms: 200, plus_rtt: true}    # srtt + max(rto_min, 4 * rttvar)
    initial_window: 10     # RFC 6928, Linux >= 2.6.39
    syn_rto_s: 1.0         # TCP_TIMEOUT_INIT (RFC 6298)
  vxworks:
    ttl: 64
    df: false
    ip_id: global
    mss: 1460
    syn_window: 8192
    window_scale: null
    window: 8192
    syn_options: [mss]
    timestamps: false
    ephemeral_ports: [1024, 5000]
    port_allocation: sequential
    delayed_ack: {probability: 0.2, min_ms: 5, max_ms: 50}
    rto: {min_ms: 500, plus_rtt: false}
    initial_window: 3      # RFC 3390: min(4 * MSS, max(2 * MSS, 4380 bytes))
    syn_rto_s: 3.0         # RFC 1122 initial RTO

