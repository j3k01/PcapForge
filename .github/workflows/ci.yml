name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Wireshark >= 4.4 CLI tools with loopback capture rights, and Suricata
        run: |
          # Ubuntu 24.04 ships Wireshark 4.2; the answer-key filters need 4.4+.
          sudo add-apt-repository -y ppa:wireshark-dev/stable
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark suricata
          sudo setcap cap_net_raw,cap_net_admin=eip "$(command -v dumpcap)"
          # Immediate loopback ACKs for the recording network (pcapforge adds it itself when permitted).
          sudo ip route add local 127.77.0.0/16 dev lo table local quickack 1
          tshark --version | head -1
          suricata -V
      - run: pip install -e .[test,opcua,s7]
      - run: pcapforge validate
      - run: pytest -q
