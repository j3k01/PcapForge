# yaml-language-server: $schema=../../../src/pcapforge/scenario/scenario.schema.json
schema: pcapforge/scenario@1
id: ot-modbus-write-manipulation
title: Unauthorized Modbus/TCP setpoint changes on a water-treatment PLC
line: ot
version: 1
license: CC-BY-4.0
authors: [pcapforge contributors]
tags: [modbus, ics, water, setpoint, ot]
summary: >
  A SCADA HMI and a historian poll the PLCs of a drinking-water treatment plant over
  Modbus/TCP. During the capture a host that is not supposed to change PLC parameters
  issues Modbus write requests that move process setpoints outside their normal band.

briefing: |
  You are the OT SOC analyst for the {site_name} water-treatment plant ({domain}).
  Operations reported unusual process behaviour during the shift. The attached capture
  comes from the SPAN port of the control-network switch ({sensor_subnet}).
  Normally only the SCADA HMI, the SCADA server (where the site has one) and the historian
  talk Modbus/TCP to the PLCs, and only the engineering workstation is allowed to change
  setpoints.
  The PLC register map is included below.

mitre:
  - {framework: ics, id: T0855, name: Unauthorized Command Message}
  - {framework: ics, id: T0836, name: Modify Parameter}
  - {framework: ics, id: T0888, name: Remote System Information Discovery, when: vars.discovery}
  - {framework: ics, id: T0861, name: Point & Tag Identification, when: vars.discovery}

site:
  names: [Brzozowa, Lipowa Dolina, Zielony Gaj, Kamienny Most, Riverbend, Oak Hollow, Millbrook]
  codes: [wtp, sut, zuw, stw]
  start_hours: [6, 21]
  weekdays: [0, 1, 2, 3, 4, 5]
  year_range: [2025, 2026]

topology:
  sensor: control
  subnets:
    - {id: control, pool: 10.0.0.0/8, prefix: 24}
    - {id: plant_it, pool: 172.16.0.0/12, prefix: 24}
  hosts:
    - {id: firewall, device: fortigate, subnets: [control, plant_it], name: "fw-{code}-01", router: true}
    - {id: plc, count: "${vars.plc_count}", device: [schneider-m340, schneider-m340, siemens-s7-1200, rockwell-micro850], subnet: control, name: "plc-{code}-{index:02d}"}
    - {id: hmi, device: windows-workstation, subnet: control, name: "HMI-{CODE}-01"}
    - {id: historian, device: windows-server-vm, subnet: control, name: "HIST-{CODE}-01"}
    - {id: ews, device: hp-workstation, subnet: control, name: "EWS-{CODE}-01"}
    - {id: dc, device: windows-server-vm, subnet: plant_it, name: "DC-{CODE}-01"}
    - {id: rogue, device: raspberry-pi, subnet: control, name: "raspberrypi", when: "vars.writer_host == 'rogue'"}
    - {id: itpc, device: linux-laptop, subnet: plant_it, name: "lt-{code}-ops07", when: "vars.writer_host == 'itpc'"}
    - {id: s7plc, device: siemens-s7-1500, subnet: control, name: "plc-{code}-tr2", when: vars.s7}
    - {id: scada, device: scada-server-vm, subnet: control, name: "SCADA-{CODE}-01", when: vars.opcua}

actors:
  - {id: plc_service, type: modbus.server, hosts: plc, params: {process: water_treatment}}
  - {id: dns_service, type: dns.server, hosts: dc}
  - {id: ntp_service, type: ntp.server, hosts: dc}
  - id: scada_poll
    type: modbus.poller
    hosts: hmi
    params: {targets: plc, interval: "${vars.hmi_interval}", jitter: 0.03}
  - id: historian_poll
    type: modbus.poller
    hosts: historian
    params: {targets: plc, interval: 10, jitter: 0.01, groups: [0, 1]}
  # Always present so the site model names the approved writer (count may be 0).
  - id: operator_changes
    type: modbus.operator
    hosts: ews
    params: {targets: plc, count: "${vars.operator_writes}"}
  - id: name_lookups
    type: dns.client
    hosts: [hmi, historian, ews]
    when: vars.dns
    params: {server: dc, per_hour: [10, 40]}
  - id: time_sync
    type: ntp.client
    hosts: [hmi, historian, ews, plc]
    when: vars.ntp
    params: {server: dc}
  - id: windows_chatter
    type: windows.chatter
    hosts: [hmi, historian, ews]
    when: vars.chatter
    params: {rate: "${vars.chatter_rate}"}
  # Second treatment train: OEM package unit on a Siemens S7-1500, monitored over S7comm.
  - id: s7_service
    type: s7.server
    hosts: s7plc
    when: vars.s7
    params: {process: water_treatment}
  - id: scada_s7_poll
    type: s7.client
    hosts: hmi
    when: vars.s7
    params: {targets: s7plc, interval: "${vars.hmi_interval}", jitter: 0.03, szl_interval: 60}
  - id: historian_s7_poll
    type: s7.client
    hosts: historian
    when: vars.s7
    params: {targets: s7plc, interval: 10, jitter: 0.01, dbs: [1], identify: false, szl_interval: 0}
  # SCADA / OPC UA server: polls the PLCs over Modbus and publishes their points as OPC UA
  # tags; the historian collects them through a subscription per PLC.
  - id: opcua_service
    type: opcua.server
    hosts: scada
    when: vars.opcua
    params: {sources: plc}
  - id: scada_io_poll
    type: modbus.poller
    hosts: scada
    when: vars.opcua
    params: {targets: plc, interval: 2.0, jitter: 0.02}
  - id: historian_opcua
    type: opcua.client
    hosts: historian
    when: vars.opcua
    params: {server: scada, publishing_interval: 2.0, keepalive_interval: 5.0}
  - id: scada_time_sync
    type: ntp.client
    hosts: scada
    when: vars.opcua
    params: {server: dc}
  - id: scada_chatter
    type: windows.chatter
    hosts: scada
    when: vars.opcua
    params: {rate: "${vars.chatter_rate}"}
  - id: change
    type: modbus.writer
    hosts: "${vars.writer_host}"
    incident: true
    params:
      targets: plc
      discovery: "${vars.discovery}"
      writes: "${vars.writes}"
      deviation: "${vars.deviation}"
      start: "${vars.start}"
      spread: "${vars.spread}"
      function: "${vars.write_function}"

difficulty:
  easy:
    duration: 15m
    impairments: {retransmit_rate: 0.0, mid_session: false}
    vars:
      plc_count: 2
      hmi_interval: 2.0
      writer_host: rogue
      discovery: true
      writes: [3, 4]
      deviation: extreme
      start: [0.35, 0.55]
      spread: 90
      write_function: single
      operator_writes: 0
      dns: false
      ntp: true
      chatter: false
      s7: false
      opcua: false
  medium:
    duration: 45m
    impairments: {retransmit_rate: 0.0005, mid_session: true}
    vars:
      plc_count: 3
      hmi_interval: 1.0
      writer_host: itpc
      discovery: true
      writes: [3, 5]
      deviation: moderate
      start: [0.25, 0.65]
      spread: 1200
      write_function: mixed
      operator_writes: 2
      dns: true
      ntp: true
      chatter: true
      chatter_rate: 1
      s7: true
      opcua: true
  hard:
    duration: 2h
    impairments: {retransmit_rate: 0.001, mid_session: true}
    vars:
      plc_count: 4
      hmi_interval: 1.0
      writer_host: ews
      discovery: false
      writes: [2, 3]
      deviation: subtle
      start: [0.2, 0.75]
      spread: 3600
      write_function: multiple
      operator_writes: 6
      dns: true
      ntp: true
      chatter: true
      chatter_rate: 2
      s7: true
      opcua: true

questions:
  - id: source_ip
    text: Which IP address issued the unauthorized Modbus write requests?
    answer: "${facts.change.source.ip}"
    type: ip
    points: 10
    hint: Start from Modbus function codes 5, 6, 15 and 16 and compare the writers with the expected roles.
    check:
      filter: "mbtcp && modbus.func_code in {5, 6, 15, 16} && ip.src == ${facts.change.source.ip} && !modbus.request_frame"
      expect: {min: "${facts.change.write_count}"}
    hunt:
      dataset: modbus
      spl: "index=* sourcetype=pcapforge:modbus write=true | stats count AS writes, min(ts) AS first, max(ts) AS last, values(dest) AS plcs, values(function) AS functions BY src | sort - writes"
      kql: "write : true"
      look_for: >-
        Every host that writes to a PLC. Only the engineering workstation (${facts.operator_changes.source.ip})
        is approved to change setpoints. Any other writer is the answer; if the workstation is the only
        writer, split its writes by `in_normal_band` - the out-of-band ones are unauthorized.
  - id: source_mac
    text: Which MAC address did the sensor see on the frames carrying those write requests?
    answer: "${facts.change.source.observed_mac}"
    type: mac
    points: 5
    hint: Routed traffic arrives with the MAC of the last hop, not of the originating host.
    check:
      filter: "mbtcp && modbus.func_code in {5, 6, 15, 16} && ip.src == ${facts.change.source.ip} && eth.src == ${facts.change.source.observed_mac}"
      expect: {min: 1}
    hunt:
      dataset: modbus
      spl: "index=* sourcetype=pcapforge:modbus write=true src=${facts.change.source.ip} | stats count BY src, src_mac"
      kql: "write : true and src : \"${facts.change.source.ip}\""
      look_for: >-
        `src_mac` is the MAC the sensor saw. A source outside the capture subnet arrives with the MAC of the
        router that forwarded it, not of the originating host.
  - id: target_ip
    text: Which PLC (IP address) received the unauthorized writes?
    answer: "${facts.change.target.ip}"
    type: ip
    points: 10
    check:
      filter: "mbtcp && modbus.func_code in {5, 6, 15, 16} && ip.src == ${facts.change.source.ip} && ip.dst == ${facts.change.target.ip}"
      expect: {min: "${facts.change.write_count}"}
    hunt:
      dataset: modbus
      spl: "index=* sourcetype=pcapforge:modbus write=true src=${facts.change.source.ip} in_normal_band=false | stats count AS writes, values(point) AS points BY dest"
      kql: "write : true and src : \"${facts.change.source.ip}\" and in_normal_band : false"
      look_for: The PLC that received the out-of-band writes.
  - id: first_write
    text: At what time (UTC) was the first unauthorized write request sent?
    answer: "${facts.change.first_write.time}"
    type: timestamp
    tolerance_s: 1
    points: 10
    check:
      filter: "frame.number == ${facts.change.first_write.frame} && modbus.func_code in {5, 6, 15, 16} && ip.src == ${facts.change.source.ip}"
      expect: {count: 1}
    hunt:
      dataset: modbus
      spl: "index=* sourcetype=pcapforge:modbus write=true src=${facts.change.source.ip} in_normal_band=false | sort 0 epoch | head 1 | table ts src dest function point value request_frame"
      kql: "write : true and src : \"${facts.change.source.ip}\" and in_normal_band : false"
      look_for: The earliest out-of-band write; `request_frame` is the frame to open in Wireshark.
  - id: points_changed
    text: Which PLC points (register map names) were changed? List them.
    answer: "${facts.change.point_names}"
    type: set
    points: 15
    foreach: facts.change.writes
    check:
      filter: "mbtcp && ip.src == ${facts.change.source.ip} && ip.dst == ${facts.change.target.ip} && modbus.func_code == ${item.function} && (modbus.reference_num == ${item.address} || modbus.regnum16 == ${item.address} || modbus.bitnum == ${item.address}) && !modbus.request_frame"
      expect: {min: 1}
    hunt:
      dataset: modbus
      spl: "index=* sourcetype=pcapforge:modbus write=true src=${facts.change.source.ip} in_normal_band=false | stats values(point) AS points BY dest"
      kql: "write : true and src : \"${facts.change.source.ip}\" and in_normal_band : false"
      look_for: The `point` names come from the register map in the briefing (address + table).
  - id: values_written
    text: For every changed point, give the engineering value that was written.
    answer: "${facts.change.values}"
    type: map
    points: 15
    foreach: facts.change.register_writes
    check:
      filter: "mbtcp && ip.src == ${facts.change.source.ip} && modbus.regnum16 == ${item.address} && modbus.regval_uint16 == ${item.raw} && !modbus.request_frame"
      expect: {min: 1}
    hunt:
      dataset: modbus
      spl: "index=* sourcetype=pcapforge:modbus write=true src=${facts.change.source.ip} in_normal_band=false | table ts dest point value unit values{}"
      kql: "write : true and src : \"${facts.change.source.ip}\" and in_normal_band : false"
      look_for: >-
        `value` is the engineering value (raw register `values` / scale). Compare it with the normal band
        in the register map.
  - id: functions_used
    text: Which Modbus function codes did the writer use?
    answer: "${facts.change.function_codes}"
    type: set
    points: 5
    hunt:
      dataset: modbus
      wireshark: "mbtcp && ip.src == ${facts.change.source.ip} && modbus.func_code in {5, 6, 15, 16} && !modbus.request_frame"
      spl: "index=* sourcetype=pcapforge:modbus write=true src=${facts.change.source.ip} in_normal_band=false | stats count BY function_code, function"
      kql: "write : true and src : \"${facts.change.source.ip}\" and in_normal_band : false"
      look_for: 6 = Write Single Register, 16 = Write Multiple Registers (5 / 15 are the coil equivalents).
  - id: discovery
    text: Before writing, did the source query the PLC identity? If so, which vendor/product did the PLC report?
    when: vars.discovery
    answer: "${facts.change.reported_identity}"
    points: 10
    check:
      filter: "mbtcp && modbus.func_code == 43 && ip.dst == ${facts.change.source.ip} && modbus.object_str_value"
      expect: {min: 1}
    hunt:
      dataset: modbus
      spl: "index=* sourcetype=pcapforge:modbus function_code=43 | table ts src dest device_identity{}"
      kql: "function_code : 43"
      look_for: >-
        Read Device Identification (function 43 / MEI 14) from a host that is not a SCADA client, followed
        by register enumeration (reads rejected with `illegal_data_address`).
  - id: impact
    text: Which measured process values are driven by the changed setpoints?
    answer: "${facts.change.affected_measurements}"
    type: set
    points: 10
    hunt:
      dataset: modbus
      wireshark: "mbtcp && ip.dst == ${facts.change.target.ip} && modbus.func_code == 4 && modbus.request_frame"
      spl: "index=* sourcetype=pcapforge:modbus write=true in_normal_band=false | stats values(point) AS changed_setpoints BY dest"
      kql: "write : true and in_normal_band : false"
      look_for: >-
        The logs carry the changed setpoints; the register map links each setpoint to the measured input
        registers that follow it. Watch those inputs drift in the HMI poll responses after the writes.
  - id: technique
    text: Which MITRE ATT&CK for ICS technique best describes the setpoint changes?
    answer: T0836
    accept: [T0836, "Modify Parameter", T0855, "Unauthorized Command Message"]
    points: 5
    hunt:
      dataset: modbus
      spl: "index=* sourcetype=pcapforge:modbus write=true in_normal_band=false | stats count BY src, dest, function"
      kql: "write : true and in_normal_band : false"
      look_for: >-
        Writes from an unapproved source are Unauthorized Command Message (T0855); their purpose, moving
        setpoints out of band, is Modify Parameter (T0836).
  - id: legit_vs_unauthorized
    when: vars.operator_writes
    text: The engineering workstation also changed setpoints legitimately. How many write requests in the capture were legitimate operator changes?
    answer: "${facts.operator_changes.write_count}"
    type: number
    points: 15
    hunt:
      dataset: modbus
      wireshark: "mbtcp && ip.src == ${facts.operator_changes.source.ip} && modbus.func_code in {5, 6, 15, 16} && !modbus.request_frame"
      spl: "index=* sourcetype=pcapforge:modbus write=true | stats count BY src, in_normal_band"
      kql: "write : true and in_normal_band : true"
      look_for: Legitimate operator changes come from the workstation and stay inside the normal band (`in_normal_band=true`).
