# yaml-language-server: $schema=../../../src/pcapforge/scenario/scenario.schema.json
schema: pcapforge/scenario@1
id: it-baseline-operations
title: Baseline of an office LAN at the start of the working day (no incident)
line: it
version: 3
license: CC-BY-4.0
authors: [pcapforge contributors]
tags: [baseline, it, dhcp, dhcp-relay, dns, ntp, https, tls, wsus, windows-update, windows, active-directory, kerberos, ldap, smb]
summary: >
  An office LAN in the morning, captured on the office switch. The domain controller on the server
  subnet serves DHCP (Windows Server, through the firewall's DHCP relay), DNS and time; office PCs
  boot and confirm the leases they held and a newly delivered PC leases its first address. The
  workstations open the intranet sites over HTTPS (Edge to IIS, a certificate from the domain's
  AD CS root CA) and scan for Windows updates at the WSUS server (on medium/hard they download an
  approved Defender update); on medium/hard they also resolve names, chatter on the link and work as
  members of an Active Directory domain, with an employee's logon. There is no incident. Use it to
  learn what a Windows office network does and to baseline it before hunting.

briefing: |
  You are joining the SOC of {site_name} ({domain}). The attached capture comes from the SPAN
  port of the office access switch ({sensor_subnet}) as the working day starts. The sensor keeps
  internal traffic only; Internet-bound sessions are logged by the firewall instead.
  Document what normal looks like on this LAN: how hosts get their addresses, which hosts came
  online during the capture, which internal web sites they use and how they get their updates.

mitre: []

site:
  names: [Brzozowa, Lipowa Dolina, Zielony Gaj, Kamienny Most, Dębowa Wola, Sosnowy Bór, Wierzbno, Jodłowice, Modrzewie, Olszynka, Bystrzyca Górna, Krzemienna, Słoneczne Pole, Łąkowo, Riverbend, Oak Hollow, Millbrook, Cedar Falls, Stonebridge, Willow Creek, Ashford Valley, Granite Ridge, Maple Crossing, Harbor Point, Pine Hollow, Silverlake]
  codes: [hq, ofc, adm, fin]
  start_hours: [7, 8]
  weekdays: [0, 1, 2, 3, 4]
  year_range: [2025, 2026]

topology:
  sensor: office
  subnets:
    - {id: office, pool: 172.16.0.0/12, prefix: 24}
    - {id: servers, pool: 10.0.0.0/8, prefix: 24}
  hosts:
    # The firewall routes between the office LAN and the server subnet and relays DHCP for the office.
    - {id: firewall, device: fortigate, subnets: [office, servers], name: "fw-{code}-01", router: true}
    - {id: dc, device: windows-server-vm, subnet: servers, name: "DC-{CODE}-01"}
    # IIS intranet web server (the portal and the helpdesk sites) and the WSUS server.
    - {id: web, device: windows-server-vm, subnet: servers, name: "WEB-{CODE}-01", aliases: [intranet, helpdesk]}
    - {id: wsus, device: windows-server-vm, subnet: servers, name: "WSUS-{CODE}-01"}
    # Office PCs that boot during the capture, and the ones that were already running.
    - {id: pc, count: "${vars.pc_count}", device: [windows-workstation, hp-workstation], subnet: office, name: "WS-{CODE}-1{index:02d}", role: workstation}
    - {id: ws, count: "${vars.ws_count}", device: [windows-workstation, hp-workstation], subnet: office, name: "WS-{CODE}-2{index:02d}", role: workstation}
    # A PC delivered for a new employee: on this LAN for the first time, not in the asset inventory yet.
    - {id: newpc, device: windows-workstation, subnet: office, name: "WS-{CODE}-0417", inventory: false}

actors:
  # Windows Server DHCP role on the domain controller, serving the office scope through the firewall's
  # DHCP relay: scope options router (the firewall), DNS server and domain name; the Windows Server
  # default lease of 8 days.
  - id: dhcp_service
    type: dhcp.server
    hosts: dc
    params: {subnet: office, pool: [100, 199], style: windows, dns: dc}
  - {id: dns_service, type: dns.server, hosts: dc}
  - {id: ntp_service, type: ntp.server, hosts: dc}
  - id: morning_boot
    type: dhcp.client
    hosts: pc
    params: {server: dc, join: [0.02, 0.6], reboot: true}
  - id: running_pcs
    type: dhcp.client
    hosts: ws
    params: {server: dc}
  - id: new_pc
    type: dhcp.client
    hosts: newpc
    params: {server: dc, join: [0.3, 0.7]}
  - id: name_lookups
    type: dns.client
    hosts: [pc, ws, newpc]
    when: vars.dns
    params: {server: dc, per_hour: [10, 40]}
  - id: time_sync
    type: ntp.client
    hosts: [pc, ws, newpc]
    params: {server: dc}
  - id: windows_chatter
    type: windows.chatter
    hosts: [pc, ws, newpc]
    when: vars.chatter
    params: {rate: "${vars.chatter_rate}", ipv6: "${vars.ipv6}"}
  # Active Directory: Group Policy refreshes of the members and an employee's logon at a PC that booted.
  - {id: domain_service, type: ad.dc, hosts: dc, when: vars.domain}
  - id: domain_members
    type: ad.member
    hosts: [pc, ws, newpc]
    when: vars.domain
    params: {dc: dc, logon: {host: pc1, at: [0.1, 0.5]}}
  # Intranet sites over HTTPS: IIS with a certificate from the AD CS enterprise root CA on the DC;
  # Edge on the workstations.
  - id: web_service
    type: https.server
    hosts: web
    params: {ca: dc, sites: {intranet: portal, helpdesk: helpdesk}}
  - id: browsing
    type: https.client
    hosts: [pc, ws, newpc]
    params: {servers: web, dns: dc, visits_per_hour: "${vars.visits_per_hour}"}
  # Windows Update against WSUS; on medium/hard a Defender security intelligence update is approved.
  - id: update_service
    type: wsus.server
    hosts: wsus
    params: {update: "${vars.wsus_update}"}
  - id: windows_update
    type: wsus.client
    hosts: [pc, ws, newpc]
    params: {server: wsus, dns: dc, scan_after: [60, 300]}

difficulty:
  easy:
    duration: 15m
    impairments: {retransmit_rate: 0.0, mid_session: false}
    vars:
      pc_count: 3
      ws_count: 2
      dns: true
      chatter: false
      domain: false
      ipv6: false
      visits_per_hour: [3, 8]
      wsus_update: false
  medium:
    duration: 45m
    impairments: {retransmit_rate: 0.0005, mid_session: true, span_duplicates: 0.002, sensor_drop: 0.0005, vlan: 30, clock_offset: [-3, 3], clock_drift_ppm: [-40, 40]}
    vars:
      pc_count: {range: [4, 6]}
      ws_count: {range: [2, 4]}
      dns: true
      chatter: true
      chatter_rate: 1
      domain: true
      ipv6: true
      visits_per_hour: [3, 8]
      wsus_update: true
  hard:
    duration: 2h
    impairments: {retransmit_rate: 0.001, mid_session: true, span_duplicates: 0.005, sensor_drop: 0.001, vlan: 130, clock_offset: [-90, 90], clock_drift_ppm: [-150, 150]}
    vars:
      pc_count: {range: [6, 10]}
      ws_count: {range: [3, 6]}
      dns: true
      chatter: true
      chatter_rate: 2
      domain: true
      ipv6: true
      visits_per_hour: [3, 8]
      wsus_update: true

questions:
  - id: dhcp_server
    text: Which host leases IP addresses on this LAN (the DHCP server)? Give its IP address.
    answer: "${facts.dhcp_service.hosts[0].ip}"
    type: ip
    points: 10
    hint: >-
      The replies on this LAN do not come from the server itself. The DHCP Server Identifier option (54)
      of an Offer or ACK names it.
    check:
      filter: "dhcp.option.dhcp == 5 && dhcp.option.dhcp_server_id == ${facts.dhcp_service.hosts[0].ip}"
      expect: {min: 1}
    hunt:
      dataset: dhcp
      spl: "index=* sourcetype=pcapforge:dhcp message IN (offer, ack) | stats count BY src, relay_addr, server_id"
      kql: "message : (\"offer\" or \"ack\")"
      zeek: {log: dhcp, count_by: [server_addr]}
      look_for: >-
        The server identifier (option 54) of every Offer and ACK. The packets come from the relay agent
        (`src`, the giaddr); Zeek's server_addr is that sender too.
  - id: relay_agent
    text: >-
      The DHCP server is on another subnet. Which address relays its replies onto this LAN (the relay
      agent address in the messages)?
    answer: "${facts.dhcp_service.relay.ip}"
    type: ip
    points: 10
    hint: A relay agent puts its address on the clients' subnet into the giaddr field (dhcp.ip.relay) and sends the replies from it.
    check:
      filter: "dhcp.option.dhcp in {2, 5} && dhcp.ip.relay == ${facts.dhcp_service.relay.ip} && ip.src == ${facts.dhcp_service.relay.ip}"
      expect: {min: 1}
    hunt:
      dataset: dhcp
      spl: "index=* sourcetype=pcapforge:dhcp message IN (offer, ack) | stats count BY src, relay_addr"
      kql: "message : (\"offer\" or \"ack\") and relay_addr : *"
      zeek: {log: dhcp, count_by: [server_addr]}
      look_for: The relay agent address (giaddr) of the replies, and the address they come from.
  - id: lease_time
    text: How long are the leases this server grants? Give the lease time in seconds.
    answer: "${facts.dhcp_service.lease_s}"
    type: number
    points: 10
    hint: The IP Address Lease Time option (51) of an Offer or a lease ACK.
    check:
      filter: "dhcp.option.ip_address_lease_time == ${facts.dhcp_service.lease_s}"
      expect: {min: 1}
    hunt:
      dataset: dhcp
      spl: "index=* sourcetype=pcapforge:dhcp message=ack lease_time_s=* | stats count BY src, lease_time_s"
      kql: "message : \"ack\" and lease_time_s : *"
      zeek: {log: dhcp, count_by: [server_addr, lease_time]}
      look_for: 691200 s is 8 days, the default lease of a Windows Server DHCP scope; T1 and T2 (options 58, 59) are 50 % and 87.5 % of it.
  - id: gateway
    text: Which default gateway does the DHCP server hand out? Give its IP address.
    answer: "${facts.dhcp_service.router.ip}"
    type: ip
    points: 10
    check:
      filter: "dhcp.option.router == ${facts.dhcp_service.router.ip}"
      expect: {min: 1}
    hunt:
      dataset: dhcp
      spl: "index=* sourcetype=pcapforge:dhcp message=ack | stats count BY src, router{}"
      kql: "message : \"ack\" and router : *"
      look_for: The Router option (3) of the server's replies.
  - id: domain_name
    text: Which DNS domain name does the DHCP server hand out?
    answer: "${facts.dhcp_service.domain}"
    accept: ["${facts.dhcp_service.domain}"]
    type: text
    points: 10
    check:
      filter: 'dhcp.option.domain_name == "${facts.dhcp_service.domain}"'
      expect: {min: 1}
    hunt:
      dataset: dhcp
      spl: "index=* sourcetype=pcapforge:dhcp message=ack | stats count BY src, domain"
      kql: "message : \"ack\" and domain : *"
      zeek: {log: dhcp, count_by: [server_addr, domain]}
      look_for: The Domain Name option (15) of the server's replies.
  - id: rebooted_hosts
    text: >-
      Office PCs booted during the capture. How many hosts confirmed an address they already held,
      without asking for a new one?
    answer: "${vars.pc_count}"
    type: number
    points: 15
    hint: >-
      A host that held a lease sends a broadcast DHCP Request with the address as Requested IP Address
      (option 50), no Server Identifier (option 54) and no Discover before it (RFC 2131 INIT-REBOOT).
    check:
      filter: "dhcp.option.dhcp == 3 && ip.src == 0.0.0.0 && dhcp.option.requested_ip_address && !dhcp.option.dhcp_server_id"
      expect: {min: "${vars.pc_count}"}
    hunt:
      dataset: dhcp
      spl: "index=* sourcetype=pcapforge:dhcp message=request | where (isnull(server_id) OR server_id=\"null\") AND isnotnull(requested_addr) AND requested_addr!=\"null\" | stats count BY client_mac, host_name, requested_addr"
      kql: "message : \"request\" and requested_addr : * and not server_id : *"
      zeek: {log: dhcp, show: [ts, mac, host_name, requested_addr, assigned_addr, msg_types]}
      look_for: >-
        Requests without a server identifier and without a Discover in the same transaction (Zeek msg_types
        REQUEST, ACK); count the distinct client MACs.
  - id: new_host
    text: One host leased an address on this LAN for the first time (a full Discover / Offer / Request / ACK exchange). Which host name did it announce?
    answer: "${facts.new_pc.clients[0].host.name}"
    accept: ["${facts.new_pc.clients[0].host.name}", "${facts.new_pc.clients[0].host.ip}"]
    type: text
    points: 15
    hint: Filter on DHCP Discover messages (dhcp.option.dhcp == 1) and read the Host Name option (12).
    check:
      filter: 'dhcp.option.dhcp == 1 && dhcp.option.hostname == "${facts.new_pc.clients[0].host.name}"'
      expect: {min: 1}
    hunt:
      dataset: dhcp
      spl: "index=* sourcetype=pcapforge:dhcp message=discover | table ts client_mac host_name vendor_class"
      kql: "message : \"discover\""
      zeek: {log: dhcp, where: {mac: "${facts.new_pc.clients[0].host.mac}"}, show: [ts, mac, host_name, assigned_addr, msg_types]}
      look_for: The only Discover in the capture; its Offer and ACK carry the address the host got.
  - id: inform_option
    text: >-
      Right after they come online, the Windows hosts send a DHCP Inform asking for one option that
      the server does not hand out (web proxy auto-discovery). Which option code is it?
    answer: 252
    type: number
    points: 10
    hint: Compare the Parameter Request List (option 55) of an Inform with the options in the server's ACK.
    check:
      filter: "dhcp.option.dhcp == 8 && dhcp.option.request_list_item == 252"
      expect: {min: 1}
  - id: logon_user
    when: vars.domain
    text: An employee logged on to the domain at one of the PCs that booted. Which domain account did they use?
    answer: "${facts.domain_members.logons[0].user}"
    accept: ["${facts.domain_members.logons[0].user}"]
    type: text
    points: 10
    hint: >-
      Logons start with a Kerberos AS exchange (kerberos.msg_type == 10). Computer accounts end with
      "$"; a person's account does not.
    check:
      filter: 'kerberos.msg_type == 10 && kerberos.CNameString == "${facts.domain_members.logons[0].user}"'
      expect: {min: 3}
    hunt:
      dataset: kerberos
      spl: "index=* sourcetype=pcapforge:kerberos request_type=AS result=success | eval account_type=if(like(client, \"%$\"), \"computer\", \"person\") | stats count, min(ts) AS first BY client, account_type, src"
      kql: "request_type : \"AS\" and result : \"success\""
      zeek: {log: kerberos, where: {request_type: AS, success: true}, count_by: [client, id.orig_h]}
      look_for: >-
        Successful AS exchanges (a new TGT). Computer accounts end with `$`; the account without `$` is
        the person who logged on at that host.
  - id: web_sites
    text: Which intranet site names do the workstations open over HTTPS? (the names they ask the server for)
    answer: "${facts.browsing.sites_visited}"
    type: set
    points: 10
    hint: A TLS ClientHello names the site in its Server Name Indication extension (tls.handshake.extensions_server_name).
    check:
      filter: "tls.handshake.type == 1 && tls.handshake.extensions_server_name"
      expect: {min: 1}
    hunt:
      dataset: tls
      spl: "index=* sourcetype=pcapforge:tls | stats count BY server_name, dest"
      kql: "server_name : *"
      zeek: {log: ssl, count_by: [server_name, id.resp_h]}
      look_for: The SNI of every TLS session; both names point at the same web server.
  - id: web_ca
    text: Which certificate authority issued the intranet web server's certificate? Give its name (CN).
    answer: "${facts.web_service.ca.name}"
    accept: ["${facts.web_service.ca.name}"]
    type: text
    points: 10
    hint: TLS 1.2 sends the certificate chain in clear text (tls.handshake.type == 11); read the issuer of the server certificate.
    check:
      filter: 'tls.handshake.type == 11 && x509sat.uTF8String == "${facts.web_service.ca.name}"'
      expect: {min: 1}
    hunt:
      dataset: tls
      spl: "index=* sourcetype=pcapforge:tls cert_issuer=* | stats count BY cert_subject, cert_issuer"
      kql: "cert_issuer : *"
      zeek: {log: x509, count_by: [certificate.subject, certificate.issuer]}
      look_for: >-
        The issuer of the server certificate: the domain's enterprise root CA (AD CS names it
        <domain>-<server>-CA). The chain also carries the CA certificate itself.
  - id: tls_cipher
    text: Which TLS cipher suite does the intranet web server choose?
    answer: TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    accept: [TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384, ECDHE-RSA-AES256-GCM-SHA384, "0xc030", c030]
    type: text
    points: 10
    hint: The ServerHello (tls.handshake.type == 2) carries the cipher suite the server picked from the client's list.
    check:
      filter: "tls.handshake.type == 2 && tls.handshake.ciphersuite == 0xc030"
      expect: {min: 1}
    hunt:
      dataset: tls
      spl: "index=* sourcetype=pcapforge:tls | stats count BY dest, version, cipher"
      kql: "cipher : *"
      zeek: {log: ssl, count_by: [id.resp_h, version, cipher]}
      look_for: >-
        Every session ends up on TLS 1.2 with the same suite: the browser offers TLS 1.3, the Windows
        Server 2019 web server does not support it and picks the first ECDHE-RSA suite of its order.
  - id: wsus_server
    text: Which server do the workstations ask for Windows updates? Give its IP address.
    answer: "${facts.update_service.hosts[0].ip}"
    type: ip
    points: 10
    hint: The Windows Update Agent talks SOAP over plain HTTP to its WSUS server (User-Agent Windows-Update-Agent).
    check:
      filter: 'http.request.method == "POST" && http.user_agent contains "Windows-Update-Agent" && ip.dst == ${facts.update_service.hosts[0].ip}'
      expect: {min: 1}
    hunt:
      dataset: http
      spl: "index=* sourcetype=pcapforge:http user_agent=\"Windows-Update-Agent*\" | stats count BY dest, dest_port, uri"
      kql: "user_agent : Windows-Update-Agent*"
      zeek: {log: http, count_by: [id.resp_h, id.resp_p, uri]}
      look_for: The server and port the Windows Update Agent posts its SOAP calls to.
  - id: wsus_port
    text: On which TCP port does that update server listen?
    answer: "${facts.update_service.port}"
    type: number
    points: 5
    check:
      filter: "tcp.dstport == ${facts.update_service.port} && http.request"
      expect: {min: 1}
  - id: wsus_calls
    text: >-
      Which SOAP methods does a workstation call on the update server during a scan? (the last part of
      the SOAPAction header)
    answer: "${facts.windows_update.soap_actions}"
    type: set
    points: 10
    hint: Each POST carries a SOAPAction header such as "http://www.microsoft.com/SoftwareDistribution/Server/ClientWebService/GetCookie".
    check:
      filter: 'http.request.line contains "SOAPAction"'
      expect: {min: 4}
    hunt:
      dataset: http
      spl: "index=* sourcetype=pcapforge:http soap_action=* | stats count BY soap_action"
      kql: "soap_action : *"
      zeek: {log: http, where: {method: POST}, count_by: [id.orig_h, uri]}
      look_for: >-
        GetConfig, GetAuthorizationCookie (on the SimpleAuth service), GetCookie and SyncUpdates, then
        GetExtendedUpdateInfo when an approved update applies.
  - id: update_file
    when: vars.wsus_update
    text: An approved update was downloaded from the update server. Which file did the workstations fetch? (file name)
    answer: "${facts.update_service.update.file}"
    accept: ["${facts.update_service.update.file}", "${facts.update_service.update.path}"]
    type: text
    points: 10
    hint: The content comes over the same HTTP port from /Content/, fetched by BITS (User-Agent Microsoft BITS).
    check:
      filter: 'http.request.method == "GET" && http.request.uri contains "${facts.update_service.update.sha1}"'
      expect: {min: 1}
    hunt:
      dataset: http
      spl: "index=* sourcetype=pcapforge:http method=GET | stats count BY src, uri, user_agent"
      kql: "method : \"GET\""
      zeek: {log: http, where: {method: GET}, show: [ts, id.orig_h, uri, user_agent, response_body_len]}
      look_for: A HEAD for the size, then a GET of /Content/<last two hex digits>/<SHA-1>.exe by BITS.
  - id: update_kb
    when: vars.wsus_update
    text: Which Knowledge Base article (KB number) is that update?
    answer: "KB${facts.update_service.update.kb}"
    accept: ["KB${facts.update_service.update.kb}", "${facts.update_service.update.kb}"]
    type: text
    points: 5
    hint: >-
      GetExtendedUpdateInfo returns the update's properties (KBArticleID) and title. The reply is
      Xpress-compressed; Wireshark decompresses it (Content-encoded entity body).
    check:
      filter: 'http.file_data contains "KBArticleID&gt;${facts.update_service.update.kb}"'
      expect: {min: 1}
  - id: wsus_encoding
    text: >-
      The update server compresses its SOAP replies on the client and authorization services. Which
      HTTP content encoding does it use?
    answer: xpress
    accept: [xpress, "Content-Encoding: xpress"]
    type: text
    points: 5
    hint: The client offers it in its Accept-Encoding header; the server names it in Content-Encoding ([MS-WUSP] 2.1.1).
    check:
      filter: 'http.content_encoding == "xpress"'
      expect: {min: 1}
    hunt:
      dataset: http
      spl: "index=* sourcetype=pcapforge:http content_encoding=* | stats count BY uri, content_encoding"
      kql: "content_encoding : *"
      look_for: Xpress-compressed responses on client.asmx and SimpleAuth.asmx; the reporting service answers in plain XML.
  - id: wsus_report
    text: After a scan the workstation reports its result to the update server. Which SOAP method does it call?
    answer: ReportEventBatch
    accept: [ReportEventBatch]
    type: text
    points: 5
    hint: The report goes to the reporting web service (/ReportingWebService/ReportingWebService.asmx).
    check:
      filter: 'http.request.uri contains "ReportingWebService" && http.request.line contains "ReportEventBatch"'
      expect: {min: 1}
    hunt:
      dataset: http
      spl: "index=* sourcetype=pcapforge:http uri=\"/ReportingWebService/*\" | stats count BY src, soap_action"
      kql: "uri : \"/ReportingWebService/ReportingWebService.asmx\""
      zeek: {log: http, where: {uri: /ReportingWebService/ReportingWebService.asmx}, count_by: [id.orig_h, uri]}
      look_for: >-
        A ReportEventBatch with AGENT_DETECTION_STARTED (141) and AGENT_DETECTION_FINISHED (147) events after
        each scan, AGENT_DOWNLOAD_SUCCEEDED (162) after a download.

translations:
  pl:
    title: Baseline sieci biurowej na początku dnia pracy (bez incydentu)
    briefing: |
      Dołączasz do SOC organizacji {site_name} ({domain}). Załączone nagranie pochodzi z portu SPAN
      przełącznika dostępowego sieci biurowej ({sensor_subnet}) z początku dnia pracy. Sensor
      zachowuje tylko ruch wewnętrzny; sesje do Internetu loguje firewall.
      Udokumentuj, jak wygląda normalny ruch w tej sieci: jak hosty dostają adresy, które hosty
      pojawiły się w sieci podczas nagrania, z jakich stron wewnętrznych korzystają i skąd biorą aktualizacje.
    questions:
      dhcp_server:
        text: Który host dzierżawi adresy IP w tej sieci (serwer DHCP)? Podaj jego adres IP.
        hint: Odpowiedzi w tej sieci nie przychodzą od samego serwera. Wskazuje go opcja DHCP Server Identifier (54) w Offer albo ACK.
      relay_agent:
        text: Serwer DHCP jest w innej podsieci. Z jakiego adresu jego odpowiedzi trafiają do tej sieci (adres agenta przekazującego w komunikatach)?
        hint: Agent przekazujący (relay) wpisuje swój adres w podsieci klientów w pole giaddr (dhcp.ip.relay) i z niego wysyła odpowiedzi.
      lease_time:
        text: Na jak długo ten serwer wydaje dzierżawy? Podaj czas dzierżawy w sekundach.
        hint: Opcja IP Address Lease Time (51) w Offer albo w ACK dzierżawy.
      gateway:
        text: Jaką bramę domyślną przekazuje serwer DHCP? Podaj jej adres IP.
      domain_name:
        text: Jaką nazwę domeny DNS przekazuje serwer DHCP?
      rebooted_hosts:
        text: Podczas nagrania uruchamiały się komputery biurowe. Ile hostów potwierdziło adres, który już miały, bez proszenia o nowy?
        hint: Host, który miał dzierżawę, wysyła rozgłoszeniowy DHCP Request z adresem w opcji Requested IP Address (50), bez Server Identifier (opcja 54) i bez wcześniejszego Discover (stan INIT-REBOOT z RFC 2131).
      new_host:
        text: Jeden host po raz pierwszy wydzierżawił adres w tej sieci (pełna wymiana Discover / Offer / Request / ACK). Jaką nazwę hosta podał?
        hint: Przefiltruj komunikaty DHCP Discover (dhcp.option.dhcp == 1) i odczytaj opcję Host Name (12).
      inform_option:
        text: Zaraz po pojawieniu się w sieci hosty Windows wysyłają DHCP Inform z prośbą o jedną opcję, której serwer nie przekazuje (automatyczne wykrywanie proxy WWW). Jaki to kod opcji?
        hint: Porównaj listę Parameter Request List (opcja 55) w Inform z opcjami w ACK serwera.
      logon_user:
        text: Pracownik zalogował się do domeny na jednym z uruchamianych komputerów. Którego konta domenowego użył?
        hint: Logowanie zaczyna się od wymiany Kerberos AS (kerberos.msg_type == 10). Konta komputerów kończą się znakiem „$”, konta osób nie.
      web_sites:
        text: Jakie nazwy stron intranetowych otwierają stacje robocze po HTTPS? (nazwy, o które proszą serwer)
        hint: ClientHello TLS podaje nazwę strony w rozszerzeniu Server Name Indication (tls.handshake.extensions_server_name).
      web_ca:
        text: Który urząd certyfikacji wystawił certyfikat intranetowego serwera WWW? Podaj jego nazwę (CN).
        hint: TLS 1.2 przesyła łańcuch certyfikatów jawnie (tls.handshake.type == 11); odczytaj wystawcę certyfikatu serwera.
      tls_cipher:
        text: Który zestaw szyfrów TLS wybiera intranetowy serwer WWW?
        hint: ServerHello (tls.handshake.type == 2) niesie zestaw szyfrów, który serwer wybrał z listy klienta.
      wsus_server:
        text: Którego serwera stacje robocze pytają o aktualizacje Windows? Podaj jego adres IP.
        hint: Windows Update Agent rozmawia ze swoim serwerem WSUS przez SOAP po zwykłym HTTP (User-Agent Windows-Update-Agent).
      wsus_port:
        text: Na którym porcie TCP nasłuchuje ten serwer aktualizacji?
      wsus_calls:
        text: Jakie metody SOAP wywołuje stacja robocza na serwerze aktualizacji podczas skanowania? (ostatnia część nagłówka SOAPAction)
        hint: Każdy POST ma nagłówek SOAPAction, np. "http://www.microsoft.com/SoftwareDistribution/Server/ClientWebService/GetCookie".
      update_file:
        text: Z serwera aktualizacji pobrano zatwierdzoną aktualizację. Jaki plik pobrały stacje robocze? (nazwa pliku)
        hint: Zawartość przychodzi tym samym portem HTTP z /Content/, pobiera ją BITS (User-Agent Microsoft BITS).
      update_kb:
        text: Którego artykułu bazy wiedzy (numer KB) dotyczy ta aktualizacja?
        hint: GetExtendedUpdateInfo zwraca właściwości aktualizacji (KBArticleID) i jej tytuł. Odpowiedź jest skompresowana Xpress; Wireshark ją rozpakowuje (Content-encoded entity body).
      wsus_encoding:
        text: Serwer aktualizacji kompresuje swoje odpowiedzi SOAP z usług klienta i autoryzacji. Jakiego kodowania treści HTTP używa?
        hint: Klient proponuje je w nagłówku Accept-Encoding, serwer podaje je w Content-Encoding ([MS-WUSP] 2.1.1).
      wsus_report:
        text: Po skanowaniu stacja robocza zgłasza wynik serwerowi aktualizacji. Jaką metodę SOAP wywołuje?
        hint: Zgłoszenie trafia do usługi raportowania (/ReportingWebService/ReportingWebService.asmx).
  de:
    title: Baseline eines Büronetzes zu Beginn des Arbeitstages (kein Vorfall)
    briefing: |
      Sie verstärken das SOC von {site_name} ({domain}). Der beigefügte Mitschnitt stammt vom
      SPAN-Port des Access-Switches im Büronetz ({sensor_subnet}) zu Beginn des Arbeitstages. Der
      Sensor behält nur internen Verkehr; Sitzungen ins Internet protokolliert die Firewall.
      Dokumentieren Sie, wie der Normalbetrieb in diesem Netz aussieht: wie Hosts ihre Adressen erhalten,
      welche Hosts während des Mitschnitts online kamen, welche internen Webseiten sie nutzen und woher
      sie ihre Updates beziehen.
    questions:
      dhcp_server:
        text: Welcher Host vergibt in diesem Netz IP-Adressen (der DHCP-Server)? Geben Sie seine IP-Adresse an.
        hint: Die Antworten in diesem Netz kommen nicht vom Server selbst. Die Option DHCP Server Identifier (54) eines Offer oder ACK nennt ihn.
      relay_agent:
        text: Der DHCP-Server steht in einem anderen Subnetz. Von welcher Adresse kommen seine Antworten in dieses Netz (die Relay-Agent-Adresse in den Nachrichten)?
        hint: Ein Relay-Agent trägt seine Adresse im Subnetz der Clients in das Feld giaddr (dhcp.ip.relay) ein und sendet die Antworten von ihr.
      lease_time:
        text: Wie lange gelten die Leases, die dieser Server vergibt? Geben Sie die Lease-Dauer in Sekunden an.
        hint: Die Option IP Address Lease Time (51) eines Offer oder eines Lease-ACK.
      gateway:
        text: Welches Standard-Gateway gibt der DHCP-Server aus? Geben Sie seine IP-Adresse an.
      domain_name:
        text: Welchen DNS-Domänennamen gibt der DHCP-Server aus?
      rebooted_hosts:
        text: Während des Mitschnitts wurden Büro-PCs gestartet. Wie viele Hosts haben eine Adresse bestätigt, die sie bereits hatten, ohne eine neue anzufordern?
        hint: Ein Host mit einer Lease sendet einen Broadcast-DHCP-Request mit der Adresse als Requested IP Address (Option 50), ohne Server Identifier (Option 54) und ohne vorheriges Discover (Zustand INIT-REBOOT nach RFC 2131).
      new_host:
        text: Ein Host hat in diesem Netz zum ersten Mal eine Adresse geleast (vollständiger Austausch Discover / Offer / Request / ACK). Welchen Hostnamen hat er angegeben?
        hint: Filtern Sie auf DHCP-Discover-Nachrichten (dhcp.option.dhcp == 1) und lesen Sie die Option Host Name (12).
      inform_option:
        text: Direkt nachdem sie online gekommen sind, senden die Windows-Hosts ein DHCP Inform und fragen nach einer Option, die der Server nicht ausgibt (automatische Erkennung des Web-Proxys). Welcher Optionscode ist es?
        hint: Vergleichen Sie die Parameter Request List (Option 55) eines Inform mit den Optionen im ACK des Servers.
      logon_user:
        text: Ein Mitarbeiter hat sich an einem der gestarteten PCs an der Domäne angemeldet. Welches Domänenkonto hat er verwendet?
        hint: Anmeldungen beginnen mit einem Kerberos-AS-Austausch (kerberos.msg_type == 10). Computerkonten enden mit „$“, Personenkonten nicht.
      web_sites:
        text: Welche Intranet-Seitennamen öffnen die Arbeitsplätze per HTTPS? (die Namen, die sie beim Server anfragen)
        hint: Ein TLS-ClientHello nennt die Seite in der Erweiterung Server Name Indication (tls.handshake.extensions_server_name).
      web_ca:
        text: Welche Zertifizierungsstelle hat das Zertifikat des Intranet-Webservers ausgestellt? Geben Sie ihren Namen (CN) an.
        hint: TLS 1.2 überträgt die Zertifikatskette im Klartext (tls.handshake.type == 11); lesen Sie den Aussteller des Serverzertifikats.
      tls_cipher:
        text: Welche TLS-Cipher-Suite wählt der Intranet-Webserver?
        hint: Das ServerHello (tls.handshake.type == 2) enthält die Cipher-Suite, die der Server aus der Liste des Clients gewählt hat.
      wsus_server:
        text: Welchen Server fragen die Arbeitsplätze nach Windows-Updates? Geben Sie seine IP-Adresse an.
        hint: Der Windows Update Agent spricht SOAP über einfaches HTTP mit seinem WSUS-Server (User-Agent Windows-Update-Agent).
      wsus_port:
        text: Auf welchem TCP-Port lauscht dieser Update-Server?
      wsus_calls:
        text: Welche SOAP-Methoden ruft ein Arbeitsplatz bei einer Suche nach Updates auf dem Update-Server auf? (der letzte Teil des SOAPAction-Headers)
        hint: Jeder POST trägt einen SOAPAction-Header wie "http://www.microsoft.com/SoftwareDistribution/Server/ClientWebService/GetCookie".
      update_file:
        text: Ein freigegebenes Update wurde vom Update-Server heruntergeladen. Welche Datei haben die Arbeitsplätze abgerufen? (Dateiname)
        hint: Der Inhalt kommt über denselben HTTP-Port aus /Content/, abgerufen von BITS (User-Agent Microsoft BITS).
      update_kb:
        text: Zu welchem Knowledge-Base-Artikel (KB-Nummer) gehört dieses Update?
        hint: GetExtendedUpdateInfo liefert die Eigenschaften des Updates (KBArticleID) und seinen Titel. Die Antwort ist Xpress-komprimiert; Wireshark entpackt sie (Content-encoded entity body).
      wsus_encoding:
        text: Der Update-Server komprimiert seine SOAP-Antworten auf den Client- und Autorisierungsdiensten. Welche HTTP-Inhaltscodierung verwendet er?
        hint: Der Client bietet sie im Header Accept-Encoding an, der Server nennt sie in Content-Encoding ([MS-WUSP] 2.1.1).
      wsus_report:
        text: Nach einer Suche meldet der Arbeitsplatz sein Ergebnis an den Update-Server. Welche SOAP-Methode ruft er auf?
        hint: Die Meldung geht an den Reporting-Webdienst (/ReportingWebService/ReportingWebService.asmx).
